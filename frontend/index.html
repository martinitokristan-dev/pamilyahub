<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icons/wallets/EF-logo-circle-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="apple-touch-icon" href="/icons/wallets/EF-logo-circle-192.png" />
    <title>EleFam</title>
    <style>
      body {
        margin: 0;
        background-color: #ffffff;
      }
      #splash {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100dvh;
        width: 100vw;
        background-color: #ffffff;
        position: fixed;
        top: 0;
        left: 0;
        z-index: 9999;
        transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.6s ease;
      }
      .splash-container {
        position: relative;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .ripple {
        position: absolute;
        bottom: -15px;
        width: 120px;
        height: 30px;
        border: 3px solid rgba(147, 51, 234, 0.6);
        background: rgba(147, 51, 234, 0.15);
        border-radius: 50%;
        opacity: 0;
        animation: water-ripple 1s infinite cubic-bezier(0.2, 0.8, 0.4, 1);
        z-index: 1;
      }
      .ripple-delay {
        animation-delay: 0.2s;
      }
      .splash-logo {
        width: 180px;
        height: 180px;
        object-fit: cover;
        border-radius: 50%;
        position: relative;
        z-index: 2;
        animation: smooth-bounce 1s infinite;
        box-shadow: 0 10px 30px rgba(147, 51, 234, 0.3);
      }
      #splash.zoom-out {
        transform: scale(8);
        opacity: 0;
        pointer-events: none;
      }
      .dark #splash {
        background-color: #09090b;
      }
      @keyframes smooth-bounce {
        0%, 100% { 
          transform: translateY(0) scale(1.05, 0.95); 
          animation-timing-function: ease-out; 
        }
        50% { 
          transform: translateY(-50px) scale(0.95, 1.05); 
          animation-timing-function: ease-in; 
        }
      }
      @keyframes water-ripple {
        0% { transform: scale(0.5); opacity: 1; }
        100% { transform: scale(2.5); opacity: 0; }
      }
    </style>
    <script>
      // Only show splash screen on mobile devices
      const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
      if (!isMobile) {
        document.documentElement.style.setProperty('--splash-display', 'none');
      } else {
        document.documentElement.style.setProperty('--splash-display', 'flex');
      }
    </script>
    <style>
      #splash {
        display: var(--splash-display, flex) !important;
      }
    </style>
  </head>
  <body>
    <div id="splash">
      <div class="splash-container">
        <div class="ripple"></div>
        <div class="ripple ripple-delay"></div>
        <img src="/icons/wallets/EF-logo-circle.png" alt="EleFam Logo" class="splash-logo" />
      </div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
