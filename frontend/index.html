<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icons/wallets/EF-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="apple-touch-icon" href="/icons/wallets/EF-logo.png" />
    <title>EleFam</title>
    <style>
      body {
        margin: 0;
        background-color: #ffffff;
      }
      #splash {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100dvh;
        width: 100vw;
        background-color: #ffffff;
        position: fixed;
        top: 0;
        left: 0;
        z-index: 9999;
      }
      .splash-logo {
        width: 180px;
        height: auto;
        animation: pulse 2s infinite cubic-bezier(0.4, 0, 0.2, 1);
      }
      @keyframes pulse {
        0%, 100% {
          opacity: 1;
          transform: scale(1);
        }
        50% {
          opacity: .8;
          transform: scale(1.05);
        }
      }
    </style>
    <script>
      // Only show splash screen on mobile devices
      const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
      if (!isMobile) {
        document.documentElement.style.setProperty('--splash-display', 'none');
      } else {
        document.documentElement.style.setProperty('--splash-display', 'flex');
      }
    </script>
    <style>
      #splash {
        display: var(--splash-display, flex) !important;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <!-- Splash screen content -->
      <div id="splash">
        <img src="/icons/wallets/EF-logo.png" alt="EleFam Logo" class="splash-logo" />
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
